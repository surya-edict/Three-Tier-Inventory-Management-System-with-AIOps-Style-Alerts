# CI/CD Pipeline
#
# Demo mode (default)
# -------------------
# If the AWS_ACCOUNT_ID secret is unset or set to the dummy placeholder
# 000000000000, the pipeline runs in demo mode. Lint & Test still runs,
# backend and frontend images are built locally, and Trivy scans those
# images. AWS OIDC, ECR login, image pushes, and GitOps manifest updates
# are skipped so the workflow can stay green without a real AWS account.
#
# In demo mode, Trivy still reports CRITICAL and HIGH findings, but it
# does not fail the job (exit-code 0). Typical base images often include
# unfixed HIGH vulnerabilities, which would otherwise keep the pipeline
# red even when no application code is at fault. When a real AWS account
# is configured, Trivy keeps the original policy (exit-code 1) and the
# job fails on CRITICAL or HIGH findings.
#
# Enabling a real AWS deployment
# ------------------------------
# 1. In AWS IAM, create an OIDC identity provider for
#    token.actions.githubusercontent.com with audience sts.amazonaws.com.
# 2. Create an IAM role named GitHubActionsOIDCRole whose trust policy
#    allows this repository's main branch to assume the role, and attach
#    ECR push permissions.
# 3. Create the backend and frontend Amazon ECR repositories.
# 4. In the GitHub repository, add these Actions secrets:
#      AWS_ACCOUNT_ID            - your 12-digit AWS account ID (not 000000000000)
#      ECR_REPOSITORY_BACKEND    - backend ECR repository name
#      ECR_REPOSITORY_FRONTEND   - frontend ECR repository name
#      AWS_REGION                - optional; defaults to us-east-1
# 5. Re-run this workflow (push to main, or "Re-run jobs" on a successful
#    demo run after the secrets are in place).
# See the "CI/CD and AWS deployment" section in the README for the full
# steps and a sample trust policy.

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '000000000000' }}
  ECR_REPOSITORY_BACKEND: ${{ secrets.ECR_REPOSITORY_BACKEND || 'inventory-backend' }}
  ECR_REPOSITORY_FRONTEND: ${{ secrets.ECR_REPOSITORY_FRONTEND || 'inventory-frontend' }}
  # True only when a real (non-empty, non-dummy) AWS_ACCOUNT_ID secret is set.
  DEPLOY_ENABLED: ${{ secrets.AWS_ACCOUNT_ID != '' && secrets.AWS_ACCOUNT_ID != '000000000000' }}

jobs:
  static-analysis:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: app/backend
        run: pip install -r requirements.txt

      - name: Run backend unit tests
        working-directory: app/backend
        run: python -m pytest -q

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
          generateSarif: "1"

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build, Scan, & Push
    needs: static-analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: images
        run: |
          BACKEND="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_BACKEND}:${GITHUB_SHA}"
          FRONTEND="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_FRONTEND}:${GITHUB_SHA}"
          echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "Backend image:  ${BACKEND}"
          echo "Frontend image: ${FRONTEND}"
          echo "Deploy enabled: ${DEPLOY_ENABLED}"

      - name: Demo mode notice
        if: env.DEPLOY_ENABLED != 'true'
        run: |
          echo "::notice::Deploy is skipped because AWS_ACCOUNT_ID is unset or set to the dummy placeholder 000000000000. Images will be built and scanned locally only; nothing is pushed to Amazon ECR. To enable a real deploy, add the AWS_ACCOUNT_ID, ECR_REPOSITORY_BACKEND, and ECR_REPOSITORY_FRONTEND secrets, configure the GitHub OIDC identity provider and the GitHubActionsOIDCRole IAM role, and re-run this workflow. Full steps are in the README section 'CI/CD and AWS deployment'."

      - name: Configure AWS Credentials via OIDC
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsOIDCRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.DEPLOY_ENABLED == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- BACKEND ---
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          load: true
          tags: ${{ steps.images.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.backend }}
          format: 'table'
          # Fail the job on CRITICAL/HIGH only when deploying to a real AWS account.
          # Demo mode reports the same findings but uses exit-code 0 so base-image
          # vulnerabilities do not block the pipeline. See the file header comment.
          exit-code: ${{ env.DEPLOY_ENABLED == 'true' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image to ECR
        if: env.DEPLOY_ENABLED == 'true'
        run: docker push ${{ steps.images.outputs.backend }}

      # --- FRONTEND ---
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          load: true
          tags: ${{ steps.images.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.frontend }}
          format: 'table'
          exit-code: ${{ env.DEPLOY_ENABLED == 'true' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image to ECR
        if: env.DEPLOY_ENABLED == 'true'
        run: docker push ${{ steps.images.outputs.frontend }}

      # --- GITOPS UPDATE ---
      - name: Update Manifests
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          sed -i "s|image: .*/${ECR_REPOSITORY_BACKEND}:.*|image: ${{ steps.images.outputs.backend }}|g" manifests/backend-deployment.yaml
          sed -i "s|image: .*/${ECR_REPOSITORY_FRONTEND}:.*|image: ${{ steps.images.outputs.frontend }}|g" manifests/frontend-deployment.yaml

      - name: Commit and Push Changes
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/
          git commit -m "chore: update image tags to ${GITHUB_SHA}"
          git push
